<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INVENIO - Menú 6 L'fraisier</title>
    <style>
        @font-face {
            font-family: 'HandelsonFour';
            src: url('./Handelson-Four.otf') format('opentype');
            font-weight: normal; font-style: normal;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        .menu-wrapper {
            position: relative;
            width: 100vw; height: 56.25vw; 
            max-width: 1920px; max-height: 1080px;
            background-image: url('Menu6.png') !important;
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        @keyframes fadeInPrecios {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dato-dinamico {
            position: absolute;
            font-family: 'HandelsonFour', sans-serif;
            color: #FFFFFF;
            font-size: 2.3vw; /* Ajustado para el tamaño de las cápsulas */
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            white-space: nowrap;
            display: block;
            text-align: right; 
            width: 130px; 
            opacity: 0;
            animation: fadeInPrecios 0.8s ease-out forwards;
        }

        /* --- POSICIONAMIENTO MANUAL POR ITEM (Según tu Imagen) --- */

        /* 1. Bandeja Pasta Seca (Superior Izquierda/Centro) */
        .item-0-ref { top: 29%; left: 29.5%; }
        .item-0-bs  { top: 36%; left: 29.5%; }

        /* 2. Pastel de Manzana (Superior Derecha) */
        .item-1-ref { top: 29%; left: 78.8%; }
        .item-1-bs  { top: 36%; left: 78.8%; }

        /* 3. Ponquesitos 6 Uds (Inferior Izquierda) */
        .item-2-ref { top: 70.4%; left: 0.5%; }
        .item-2-bs  { top: 77.2%; left: 5.5%; }

        /* 4. Ponquesitos 4 Uds (Inferior Centro-Izquierda) */
        .item-3-ref { top: 70.4%; left: 29.5%; }
        .item-3-bs  { top: 77.2%; left: 29.5%; }

        /* 5. Golfeado Clásico (Inferior Centro-Derecha) */
        .item-4-ref { top: 70.4%; left: 48.5%; }
        .item-4-bs  { top: 77.2%; left: 48.5%; }

        /* 6. Golfeado con Queso (Inferior Derecha) */
        .item-5-ref { top: 70.4%; left: 78.8%; }
        .item-5-bs  { top: 77.2%; left: 78.8%; }

        /* --- BLOQUEO Y ESTADO --- */
        #bloqueo-tecnico {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; color: #fff;
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 9999; text-align: center; font-family: sans-serif;
        }
        #debug-status {
            position: fixed; bottom: 10px; left: 10px;
            font-size: 16px; z-index: 1000;
        }
        .online { color: #00FF00; opacity: 0.3; }
        .offline { color: #FF0000; opacity: 1; }
    </style>
</head>
<body>

    <div id="bloqueo-tecnico"><h1>CONTACTAR AL SERVICIO TÉCNICO</h1></div>

    <div class="menu-wrapper" id="menu-container"></div>
    <div id="debug-status"></div>

<script>
    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRP_2V2eaoFc7-LdDWqGKGPNjAnTsjzUDnPSixlq8cL3M0acXOwobipdRIyvBGBzyMr0OmPCDTjTbOZ/pub?gid=193312628&single=true&output=csv";

    let lastData = ""; 

    function parsearCSV(linea) {
        const columnas = [];
        let celda = "", dentroComillas = false;
        for (let char of linea) {
            if (char === '"') dentroComillas = !dentroComillas;
            else if (char === ',' && !dentroComillas) {
                columnas.push(celda.trim());
                celda = "";
            } else celda += char;
        }
        columnas.push(celda.trim());
        return columnas;
    }

    function renderizarMenu(csvText) {
        if (csvText === lastData) return;
        lastData = csvText;

        const contenedor = document.getElementById('menu-container');
        const pantallaBloqueo = document.getElementById('bloqueo-tecnico');
        const debug = document.getElementById('debug-status');

        if (csvText.includes("BLOQUEAR")) {
            pantallaBloqueo.style.display = "flex";
            contenedor.style.display = "none";
            return;
        }

        pantallaBloqueo.style.display = "none";
        contenedor.style.display = "block";

        const lineas = csvText.split(/\r?\n/).filter(l => l.trim() !== "");
        const datos = lineas.slice(1); 
        
        let htmlFinal = "";

        datos.forEach((linea, i) => {
            if (i < 6) {
                const col = parsearCSV(linea);
                const precioBs = col[1] || "";
                const precioRef = col[3] || "";
                
                if (precioBs !== "") {
                    const delay = i * 0.1;
                    htmlFinal += `
                        <div class="dato-dinamico item-${i}-ref" style="animation-delay: ${delay}s">${precioRef}</div>
                        <div class="dato-dinamico item-${i}-bs" style="animation-delay: ${delay + 0.05}s">${precioBs}</div>
                    `;
                }
            }
        });

        contenedor.innerHTML = htmlFinal;
        debug.innerHTML = "✔"; debug.className = "online";
    }

    async function sincronizar() {
        try {
            const res = await fetch(`${sheetURL}&cb=${Date.now()}`);
            const csvText = await res.text();
            localStorage.setItem('backup_m6', csvText);
            renderizarMenu(csvText);
        } catch (e) {
            const backup = localStorage.getItem('backup_m6');
            if (backup) renderizarMenu(backup);
            document.getElementById('debug-status').innerHTML = "✘";
            document.getElementById('debug-status').className = "offline";
        }
    }

    sincronizar();
    setInterval(sincronizar, 60000);
</script>
</body>
</html>
