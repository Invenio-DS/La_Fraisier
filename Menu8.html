<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INVENIO - Jugo Único</title>
    <style>
        @font-face {
            font-family: 'HandelsonFour';
            src: url('./Handelson-Four.otf') format('opentype');
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; overflow: hidden;
        }

        .menu-wrapper {
            position: relative;
            width: 100vw; height: 100vh; 
        }

        #bg-video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
        }

        #precios-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999;
            pointer-events: none;
        }

        .dato-dinamico {
            position: absolute;
            font-family: 'HandelsonFour', sans-serif;
            color: #FFFFFF;
            text-shadow: 3px 3px 6px rgba(0,0,0,1);
            text-align: right; 
            width: 300px; /* Más ancho para precios grandes */
        }

        /* --- COORDENADAS PARA EL PRODUCTO ÚNICO --- */
        /* Ajusta estos valores para centrarlo donde desees en el video */
        .pos-ref { 
            top: 40%; 
            left: 50%; 
            transform: translateX(-50%); 
            font-size: 5vw; 
            color: #00FF00; 
        }

        .pos-bs { 
            top: 52%; 
            left: 50%; 
            transform: translateX(-50%); 
            font-size: 3.5vw; 
        }

        #debug-status {
            position: fixed; bottom: 5px; left: 5px;
            color: yellow; font-size: 10px; z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="menu-wrapper">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="Menu8.mp4" type="video/mp4">
        </video>
        <div id="precios-layer"></div>
    </div>

    <div id="debug-status">Conectando...</div>

<script>
    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRP_2V2eaoFc7-LdDWqGKGPNjAnTsjzUDnPSixlq8cL3M0acXOwobipdRIyvBGBzyMr0OmPCDTjTbOZ/pub?gid=1499002722&single=true&output=csv";

    function parsearCSV(linea) {
        const columnas = [];
        let celda = "", dentroComillas = false;
        for (let char of linea) {
            if (char === '"') dentroComillas = !dentroComillas;
            else if (char === ',' && !dentroComillas) {
                columnas.push(celda.trim());
                celda = "";
            } else celda += char;
        }
        columnas.push(celda.trim());
        return columnas;
    }

    function renderizarMenu(csvText) {
        const lineas = csvText.split(/\r?\n/).filter(l => l.trim() !== "");
        const contenedor = document.getElementById('precios-layer');
        const debug = document.getElementById('debug-status');
        
        // ACCEDEMOS DIRECTO A LA LÍNEA 2 (Índice 1 en programación)
        if (lineas.length >= 2) {
            const col = parsearCSV(lineas[1]); 
            const precioBs = col[1] ? col[1].trim() : "0.00"; // Columna B
            const precioRef = col[3] ? col[3].trim() : "0.00"; // Columna D

            contenedor.innerHTML = `
                <div class="dato-dinamico pos-ref">${precioRef}</div>
                <div class="dato-dinamico pos-bs">${precioBs}</div>
            `;
            debug.innerText = "Producto cargado desde Fila 2";
        } else {
            debug.innerText = "Error: El Excel no tiene fila 2";
        }
    }

    async function sincronizar() {
        try {
            const res = await fetch(`${sheetURL}&cb=${new Date().getTime()}`);
            const csvText = await res.text();
            localStorage.setItem('backup_m8_unico', csvText);
            renderizarMenu(csvText);
        } catch (e) {
            const backup = localStorage.getItem('backup_m8_unico');
            if (backup) renderizarMenu(backup);
            document.getElementById('debug-status').innerText = "Modo Offline (Sin Internet)";
        }
    }

    sincronizar();
    setInterval(sincronizar, 60000);
</script>
</body>
</html>
