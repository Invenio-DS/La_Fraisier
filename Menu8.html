<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INVENIO - Menú 8 Motion Blur</title>
    <style>
        @font-face {
            font-family: 'HandelsonFour';
            src: url('./Handelson-Four.otf') format('opentype');
            font-weight: normal; font-style: normal;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; overflow: hidden;
        }

        .menu-wrapper {
            position: relative;
            width: 100vw; height: 100vh; 
        }

        #bg-video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
        }

        #precios-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999;
            pointer-events: none;
        }

        /* --- DEFINICIÓN DE LA ANIMACIÓN CON MOTION BLUR --- */
        @keyframes slideInWithBlur {
            0% {
                transform: translateX(100vw); /* Empieza fuera de la pantalla (derecha) */
                opacity: 0;
                filter: blur(15px); /* Mucha difuminación al inicio (velocidad máxima simulada) */
            }
            30% {
                opacity: 1; /* Aparece rápido */
            }
            60% {
                filter: blur(5px); /* Se aclara un poco mientras desacelera */
            }
            100% {
                transform: translateX(0); /* Llega a su posición final */
                filter: blur(0); /* Difuminación cero (totalmente nítido) */
            }
        }

        .dato-dinamico {
            position: absolute;
            font-family: 'HandelsonFour', 'Arial Black', sans-serif;
            color: #FFFFFF;
            text-shadow: 4px 4px 8px rgba(0,0,0,1);
            white-space: nowrap;
            display: block;
            
            /* Aplicación de la animación: un poco más lenta para que se note la difuminación */
            animation: slideInWithBlur 1.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        /* --- CONTROL DE POSICIÓN --- */
        .pos-ref { 
            top: 36.5%;    
            left: 84%;   /* Ajusta aquí tu posición horizontal final */
            font-size: 4vw; 
            color: #FFFFFF; 
            animation-delay: 0.1s; /* Retraso mínimo para el primero */
        }

        .pos-bs { 
            top: 47.5%;    
            left: 80%;   /* Ajusta aquí tu posición horizontal final */
            font-size: 4vw; 
            animation-delay: 0.3s; /* El segundo entra desfasado */
        }

        #debug-status {
            position: fixed; bottom: 10px; left: 10px;
            font-size: 14px; z-index: 1000;
            transition: opacity 0.5s;
        }
        .online { color: #00FF00; opacity: 0.3; }
        .offline { color: #FF0000; opacity: 1; }
    </style>
</head>
<body>

    <div class="menu-wrapper">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="Menu8.mp4" type="video/mp4">
        </video>
        <div id="precios-layer"></div>
    </div>

    <div id="debug-status" class="online">...</div>

<script>
    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRP_2V2eaoFc7-LdDWqGKGPNjAnTsjzUDnPSixlq8cL3M0acXOwobipdRIyvBGBzyMr0OmPCDTjTbOZ/pub?gid=1499002722&single=true&output=csv";

    function parsearCSV(linea) {
        const columnas = [];
        let celda = "", dentroComillas = false;
        for (let char of linea) {
            if (char === '"') dentroComillas = !dentroComillas;
            else if (char === ',' && !dentroComillas) {
                columnas.push(celda.trim());
                celda = "";
            } else celda += char;
        }
        columnas.push(celda.trim());
        return columnas;
    }

    function renderizarMenu(csvText) {
        const lineas = csvText.split(/\r?\n/).filter(l => l.trim() !== "");
        const contenedor = document.getElementById('precios-layer');
        const debug = document.getElementById('debug-status');
        
        if (lineas.length >= 2) {
            const col = parsearCSV(lineas[1]); 
            const precioBs = col[1] ? col[1].trim() : ""; 
            const precioRef = col[3] ? col[3].trim() : ""; 

            contenedor.innerHTML = `
                <div class="dato-dinamico pos-ref">${precioRef}</div>
                <div class="dato-dinamico pos-bs">${precioBs}</div>
            `;
            
            debug.innerHTML = "✔"; 
            debug.className = "online";
        } else {
            debug.innerHTML = "✘"; 
            debug.className = "offline";
        }
    }

    async function sincronizar() {
        try {
            const res = await fetch(`${sheetURL}&cb=${new Date().getTime()}`);
            const csvText = await res.text();
            localStorage.setItem('backup_m8_jugo', csvText);
            renderizarMenu(csvText);
        } catch (e) {
            const backup = localStorage.getItem('backup_m8_jugo');
            if (backup) renderizarMenu(backup);
        }
    }

    sincronizar();
    setInterval(sincronizar, 60000);
</script>
</body>
</html>
