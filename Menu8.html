<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INVENIO - Menú 8 Motion Blur</title>
    <style>
        @font-face {
            font-family: 'HandelsonFour';
            src: url('./Handelson-Four.otf') format('opentype');
            font-weight: normal; font-style: normal;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; overflow: hidden;
        }

        .menu-wrapper {
            position: relative;
            width: 100vw; height: 100vh; 
        }

        #bg-video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
        }

        #precios-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999;
            pointer-events: none;
        }

        /* --- ANIMACIÓN CORREGIDA --- */
        @keyframes slideInWithBlur {
            0% {
                transform: translateX(100vw);
                opacity: 0;
                filter: blur(15px);
            }
            30% { opacity: 1; }
            60% { filter: blur(5px); }
            100% {
                transform: translateX(0);
                opacity: 1; /* Forzamos visibilidad final */
                filter: blur(0);
            }
        }

        .dato-dinamico {
            position: absolute;
            font-family: 'HandelsonFour', 'Arial Black', sans-serif;
            color: #FFFFFF;
            text-shadow: 4px 4px 8px rgba(0,0,0,1);
            white-space: nowrap;
            display: block;
            /* forwards es vital para que no desaparezca al terminar */
            animation: slideInWithBlur 1.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            opacity: 0; 
        }

        .pos-ref { top: 36.5%; left: 84%; font-size: 4vw; animation-delay: 0.1s; }
        .pos-bs { top: 47.6%; left: 79.9%; font-size: 4vw; animation-delay: 0.3s; }

        #bloqueo-tecnico {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; color: #fff;
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 9999; text-align: center; font-family: sans-serif;
        }

        #debug-status { position: fixed; bottom: 10px; left: 10px; font-size: 14px; z-index: 1000; }
        .online { color: #00FF00; opacity: 0.3; }
        .offline { color: #FF0000; opacity: 1; }
    </style>
</head>
<body>

    <div id="bloqueo-tecnico"><h1>CONTACTAR AL SERVICIO TÉCNICO</h1></div>

    <div class="menu-wrapper" id="main-content">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="Menu8.mp4" type="video/mp4">
        </video>
        <div id="precios-layer"></div>
    </div>

    <div id="debug-status"></div>

<script>
    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRP_2V2eaoFc7-LdDWqGKGPNjAnTsjzUDnPSixlq8cL3M0acXOwobipdRIyvBGBzyMr0OmPCDTjTbOZ/pub?gid=1499002722&single=true&output=csv";
    
    let lastData = ""; // Para comparar si el contenido cambió

    function parsearCSV(linea) {
        const columnas = [];
        let celda = "", dentroComillas = false;
        for (let char of linea) {
            if (char === '"') dentroComillas = !dentroComillas;
            else if (char === ',' && !dentroComillas) {
                columnas.push(celda.trim());
                celda = "";
            } else celda += char;
        }
        columnas.push(celda.trim());
        return columnas;
    }

    function renderizarMenu(csvText) {
        // Si los datos son idénticos a los actuales, no hacemos nada (evita parpadeo)
        if (csvText === lastData) return;
        lastData = csvText;

        const lineas = csvText.split(/\r?\n/).filter(l => l.trim() !== "");
        const contenedor = document.getElementById('precios-layer');
        const mainContent = document.getElementById('main-content');
        const pantallaBloqueo = document.getElementById('bloqueo-tecnico');
        const debug = document.getElementById('debug-status');

        if (csvText.includes("BLOQUEAR")) {
            pantallaBloqueo.style.display = "flex";
            mainContent.style.display = "none";
            return;
        }

        pantallaBloqueo.style.display = "none";
        mainContent.style.display = "block";

        if (lineas.length >= 2) {
            const col = parsearCSV(lineas[1]); 
            const precioBs = col[1] || ""; 
            const precioRef = col[3] || ""; 

            contenedor.innerHTML = `
                <div class="dato-dinamico pos-ref">${precioRef}</div>
                <div class="dato-dinamico pos-bs">${precioBs}</div>
            `;
            debug.innerHTML = "✔"; debug.className = "online";
        }
    }

    async function sincronizar() {
        try {
            const res = await fetch(`${sheetURL}&cb=${Date.now()}`);
            const csvText = await res.text();
            localStorage.setItem('backup_m8', csvText);
            renderizarMenu(csvText);
        } catch (e) {
            const backup = localStorage.getItem('backup_m8');
            if (backup) renderizarMenu(backup);
            document.getElementById('debug-status').innerHTML = "✘";
            document.getElementById('debug-status').className = "offline";
        }
    }

    sincronizar();
    setInterval(sincronizar, 30000); // Revisar cada 30 seg (más fluido)
</script>
</body>
</html>
