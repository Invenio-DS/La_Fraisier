<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INVENIO - Menú 2 L'fraisier</title>
    <style>
        @font-face {
            font-family: 'HandelsonFour';
            /* CORRECCIÓN: Nombre exacto del archivo con H mayúscula */
            src: url('./Handelson-Four.otf') format('opentype');
            font-weight: normal; font-style: normal;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        .menu-wrapper {
            position: relative;
            width: 100vw; height: 56.25vw; 
            max-width: 1920px; max-height: 1080px;
            background-image: url('Menu2.png') !important;
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        @keyframes fadeInPrecios {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dato-dinamico {
            position: absolute;
            font-family: 'HandelsonFour', sans-serif;
            color: #FFFFFF;
            font-size: 2.1vw;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            white-space: nowrap;
            display: block;
            text-align: right; 
            width: 120px; 
            opacity: 0;
            animation: fadeInPrecios 0.9s ease-out forwards;
        }

        /* --- COORDENADAS MANTENIDAS --- */
        .col-izq-ref { left: 34.1%; }
        .col-izq-bs  { left: 34.1%; }
        .col-der-ref { left: 80.5%; }
        .col-der-bs  { left: 80.5%; }

        .y-sup-ref { top: 30.5%; }
        .y-sup-bs  { top: 36.8%; }
        .y-inf-ref { top: 69.8%; }
        .y-inf-bs  { top: 76.1%; }
    </style>
</head>
<body>

    <div class="menu-wrapper" id="menu-container"></div>

<script>
    // URL de la pestaña Menu 2
    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRP_2V2eaoFc7-LdDWqGKGPNjAnTsjzUDnPSixlq8cL3M0acXOwobipdRIyvBGBzyMr0OmPCDTjTbOZ/pub?gid=1532502441&single=true&output=csv";

    // --- 1. LIMPIEZA AGRESIVA AL CARGAR ---
    (function limpiarCacheAntiguo() {
        console.log("INVENIO: Ejecutando limpieza de arranque...");
        // Borramos específicamente el backup del menú 1 si existe
        localStorage.removeItem('invenio_backup'); 
        localStorage.removeItem('backup_invenio');
        // Si quieres borrar TODO para empezar de cero, usa: localStorage.clear();
    })();

    // ... (mantén tus funciones parsearCSV y renderizarMenu igual) ...

    async function sincronizar() {
        const timestamp = new Date().getTime();
        console.log("INVENIO: Intentando sincronización fresca v." + timestamp);
        
        try {
            // Añadimos parámetros extra para romper el caché de los servidores de Google
            const res = await fetch(`${sheetURL}&cachebust=${timestamp}&refresh=true`, {
                method: 'GET',
                cache: 'no-store',
                headers: {
                    'Cache-Control': 'no-cache, no-store, must-revalidate',
                    'Pragma': 'no-cache'
                }
            });

            if (!res.ok) throw new Error("Error de red");
            
            const csvText = await res.text();

            // --- 2. VALIDACIÓN DE CONTENIDO ---
            // Solo guardamos si el CSV contiene palabras del Menú 2 (Mini o Pizza)
            // Esto evita que el "fantasma" del Menú 1 se guarde por error
            if (csvText.toLowerCase().includes("mini") || csvText.toLowerCase().includes("pizza")) {
                localStorage.setItem('backup_MENU_DOS_FINAL', csvText);
                renderizarMenu(csvText);
                console.log("INVENIO: Menú 2 cargado y guardado en backup nuevo.");
            } else {
                console.error("INVENIO: Google entregó datos que no parecen del Menú 2.");
            }

        } catch (error) {
            console.warn("INVENIO: Sin conexión. Usando respaldo exclusivo del Menú 2.");
            const backup = localStorage.getItem('backup_MENU_DOS_FINAL');
            if (backup) renderizarMenu(backup);
        }
    }

    // Registro de Service Worker (si lo usas)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for(let registration of registrations) {
                registration.unregister(); // Forzamos actualización del SW también
            }
        });
    }

    sincronizar();
    // Refresco cada 3 minutos
    setInterval(sincronizar, 180000);
</script>
</body>
</html>
