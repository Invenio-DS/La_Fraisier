<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INVENIO - Menú 2 L'fraisier</title>
    <style>
        @font-face {
            font-family: 'HandelsonFour';
            /* CORRECCIÓN: Nombre exacto del archivo con H mayúscula */
            src: url('./Handelson-Four.otf') format('opentype');
            font-weight: normal; font-style: normal;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        .menu-wrapper {
            position: relative;
            width: 100vw; height: 56.25vw; 
            max-width: 1920px; max-height: 1080px;
            background-image: url('Menu2.png') !important;
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        @keyframes fadeInPrecios {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dato-dinamico {
            position: absolute;
            font-family: 'HandelsonFour', sans-serif;
            color: #FFFFFF;
            font-size: 2.1vw;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            white-space: nowrap;
            display: block;
            text-align: right; 
            width: 120px; 
            opacity: 0;
            animation: fadeInPrecios 0.9s ease-out forwards;
        }

        /* --- COORDENADAS MANTENIDAS --- */
        .col-izq-ref { left: 34.1%; }
        .col-izq-bs  { left: 34.1%; }
        .col-der-ref { left: 80.5%; }
        .col-der-bs  { left: 80.5%; }

        .y-sup-ref { top: 30.5%; }
        .y-sup-bs  { top: 36.8%; }
        .y-inf-ref { top: 69.8%; }
        .y-inf-bs  { top: 76.1%; }
    </style>
</head>
<body>

    <div class="menu-wrapper" id="menu-container"></div>

<script>
    // URL Corregida para forzar la pestaña Menu 2 (GID: 1532502441)
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRP_2V2eaoFc7-LdDWqGKGPNjAnTsjzUDnPSixlq8cL3M0acXOwobipdRIyvBGBzyMr0OmPCDTjTbOZ/pub?gid=1532502441&single=true&output=csv";

    function parsearCSV(linea) {
        const columnas = [];
        let celda = "", dentroComillas = false;
        for (let char of linea) {
            if (char === '"') dentroComillas = !dentroComillas;
            else if (char === ',' && !dentroComillas) {
                columnas.push(celda.trim());
                celda = "";
            } else celda += char;
        }
        columnas.push(celda.trim());
        return columnas;
    }

    function renderizarMenu(csvText) {
        const lineas = csvText.split(/\r?\n/).filter(l => l.trim() !== "");
        const datos = lineas.slice(1); 
        const contenedor = document.getElementById('menu-container');
        let htmlFinal = "";

        const cuadrantes = [
            { ref: "col-izq-ref y-sup-ref", bs: "col-izq-bs y-sup-bs" },
            { ref: "col-der-ref y-sup-ref", bs: "col-der-bs y-sup-bs" },
            { ref: "col-izq-ref y-inf-ref", bs: "col-izq-bs y-inf-bs" },
            { ref: "col-der-ref y-inf-ref", bs: "col-der-bs y-inf-bs" } 
        ];

        datos.forEach((linea, i) => {
            if (i < 4) {
                const col = parsearCSV(linea);
                if (col.length >= 4) {
                    const precioBs = col[1]; 
                    const precioRef = col[3];
                    if (precioBs) {
                        const pos = cuadrantes[i];
                        htmlFinal += `
                            <div class="dato-dinamico ${pos.ref}">${precioRef}</div>
                            <div class="dato-dinamico ${pos.bs}">${precioBs}</div>
                        `;
                    }
                }
            }
        });
        contenedor.innerHTML = htmlFinal;
    }

    async function sincronizar() {
        try {
            const timestamp = new Date().getTime();
            const res = await fetch(`${sheetURL}&version=${timestamp}`, {
                method: 'GET',
                cache: 'no-store',
                headers: {
                    'Cache-Control': 'no-cache, no-store, must-revalidate',
                    'Pragma': 'no-cache',
                    'Expires': '0'
                }
            });

            if (!res.ok) throw new Error("Error de red");
            const csvText = await res.text();
            localStorage.setItem('backup_m2', csvText);
            renderizarMenu(csvText);
            console.log("INVENIO: Sincronizado OK v." + timestamp);
        } catch (e) {
            console.warn("INVENIO: Usando backup.");
            const backup = localStorage.getItem('backup_m2');
            if (backup) renderizarMenu(backup);
        }
    }

    sincronizar();
    setInterval(sincronizar, 120000);
</script>
</body>
</html>
