<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INVENIO - Menu 9 (4 Tamaños)</title>
    <style>
        @font-face {
            font-family: 'HandelsonFour';
            src: url('./Handelson-Four.otf') format('opentype');
            font-weight: normal; font-style: normal;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        .menu-wrapper {
            position: relative;
            width: 100vw; height: 100vh; 
            overflow: hidden;
        }

        #bg-video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
        }

        #precios-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999;
            pointer-events: none;
        }

        @keyframes fadeInPrecios {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dato-dinamico {
            position: absolute;
            font-family: 'HandelsonFour', sans-serif;
            color: #FFFFFF;
            font-size: 2vw; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            white-space: nowrap;
            display: block;
            text-align: center; 
            width: 180px; 
            opacity: 0;
            animation: fadeInPrecios 0.8s ease-out forwards;
        }

        /* --- COORDENADAS PARA LOS 4 TAMAÑOS --- */

        /* Bloque 1 (Fila 1 Excel - Superior Izquierda) */
        .pos-1-ref { top: 35%; left: 10%; color: #FFFFFF; }
        .pos-1-bs  { top: 38%; left: 10%; }

        /* Bloque 2 (Fila 2 Excel - Superior Derecha) */
        .pos-3-ref { top: 70%; left: 10%; color: #00FF00; }
        .pos-3-bs  { top: 77%; left: 10%; }

        /* Bloque 3 (Fila 3 Excel - Inferior Izquierda) */
        .pos-2-ref { top: 35%; left: 80%; color: #FFFFFF; }
        .pos-2-bs  { top: 28%; left: 80%; }

        /* Bloque 4 (Fila 4 Excel - Inferior Derecha) */
        .pos-4-ref { top: 70%; left: 80%; color: #FFFFFF; }
        .pos-4-bs  { top: 77%; left: 80%; }

        /* --- ICONO DE ESTADO --- */
        #debug-status {
            position: fixed; bottom: 10px; left: 10px;
            font-size: 16px; z-index: 1000;
            transition: opacity 0.5s;
            font-family: sans-serif;
        }
        .online { color: #00FF00; opacity: 0.3; }
        .offline { color: #FF0000; opacity: 1; }

    </style>
</head>
<body>

    <div class="menu-wrapper">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="Menu9.mp4" type="video/mp4">
        </video>
        <div id="precios-layer"></div>
    </div>
    
    <div id="debug-status"></div>

<script>
    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRP_2V2eaoFc7-LdDWqGKGPNjAnTsjzUDnPSixlq8cL3M0acXOwobipdRIyvBGBzyMr0OmPCDTjTbOZ/pub?gid=1820236060&single=true&output=csv";

    function parsearCSV(linea) {
        const columnas = [];
        let celda = "", dentroComillas = false;
        for (let char of linea) {
            if (char === '"') dentroComillas = !dentroComillas;
            else if (char === ',' && !dentroComillas) {
                columnas.push(celda.trim());
                celda = "";
            } else celda += char;
        }
        columnas.push(celda.trim());
        return columnas;
    }

    function renderizarMenu(csvText) {
        const lineas = csvText.split(/\r?\n/).filter(l => l.trim() !== "");
        const datos = lineas.slice(1); 
        const contenedor = document.getElementById('precios-layer');
        const debug = document.getElementById('debug-status');
        let htmlFinal = "";

        // Mapeo para los 4 tamaños
        const cuadrantes = [
            { ref: "pos-1-ref", bs: "pos-1-bs" }, // Fila 1
            { ref: "pos-2-ref", bs: "pos-2-bs" }, // Fila 2
            { ref: "pos-3-ref", bs: "pos-3-bs" }, // Fila 3
            { ref: "pos-4-ref", bs: "pos-4-bs" }  // Fila 4
        ];

        datos.forEach((linea, i) => {
            if (i < 4) { 
                const col = parsearCSV(linea);
                const precioBs = col[1];  // Columna B
                const precioRef = col[3]; // Columna D
                
                if (precioBs || precioRef) {
                    const pos = cuadrantes[i];
                    htmlFinal += `
                        <div class="dato-dinamico ${pos.ref}">${precioRef}</div>
                        <div class="dato-dinamico ${pos.bs}">${precioBs}</div>
                    `;
                }
            }
        });
        contenedor.innerHTML = htmlFinal;

        debug.innerHTML = "✔";
        debug.className = "online";
    }

    async function sincronizar() {
        const debug = document.getElementById('debug-status');
        try {
            const res = await fetch(`${sheetURL}&cb=${new Date().getTime()}`);
            const csvText = await res.text();
            localStorage.setItem('backup_m9', csvText);
            renderizarMenu(csvText);
        } catch (e) {
            const backup = localStorage.getItem('backup_m9');
            if (backup) renderizarMenu(backup);
            debug.innerHTML = "✘";
            debug.className = "offline";
        }
    }

    sincronizar();
    setInterval(sincronizar, 60000); 
</script>
</body>
</html>
