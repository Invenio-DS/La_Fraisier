<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INVENIO - Menu 9 (4 Tamaños)</title>
    <style>
        @font-face {
            font-family: 'HandelsonFour';
            src: url('./Handelson-Four.otf') format('opentype');
            font-weight: normal; font-style: normal;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        .menu-wrapper {
            position: relative;
            width: 100vw; height: 100vh; 
            overflow: hidden;
        }

        #bg-video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
        }

        #precios-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999;
            pointer-events: none;
        }

        @keyframes fadeInPrecios {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dato-dinamico {
            position: absolute;
            font-family: 'HandelsonFour', sans-serif;
            color: #FFFFFF;
            font-size: 3.3vw; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            white-space: nowrap;
            display: block;
            text-align: right; 
            width: 160px; 
            opacity: 0;
            animation: fadeInPrecios 0.8s ease-out forwards;
        }

        /* --- COORDENADAS PARA LOS 4 TAMAÑOS --- */
        .pos-1-ref { top: 43.3%; left: 0.5%; }
        .pos-1-bs  { top: 52%; left: 0.5%; }

        .pos-2-ref { top: 43.3%; left: 77%; }
        .pos-2-bs  { top: 52%; left: 77%; }

        .pos-3-ref { top: 71%; left: 0.5%; }
        .pos-3-bs  { top: 80%; left: 0.5%; }

        .pos-4-ref { top: 71%; left: 77%; }
        .pos-4-bs  { top: 80%; left: 77%; }

        /* --- ESTILOS DE SEGURIDAD Y ESTADO --- */
        #bloqueo-tecnico {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; color: #fff;
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 9999; text-align: center; font-family: sans-serif;
        }
        #bloqueo-tecnico h1 { font-size: 5vw; margin: 0; }

        #debug-status {
            position: fixed; bottom: 10px; left: 10px;
            font-size: 16px; z-index: 1000;
            font-family: sans-serif;
        }
        .online { color: #00FF00; opacity: 0.3; }
        .offline { color: #FF0000; opacity: 1; }

    </style>
</head>
<body>

    <div id="bloqueo-tecnico">
        <h1>CONTACTAR AL SERVICIO TÉCNICO</h1>
    </div>

    <div class="menu-wrapper" id="main-content">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="Menu9.mp4" type="video/mp4">
        </video>
        <div id="precios-layer"></div>
    </div>
    
    <div id="debug-status"></div>

<script>
    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRP_2V2eaoFc7-LdDWqGKGPNjAnTsjzUDnPSixlq8cL3M0acXOwobipdRIyvBGBzyMr0OmPCDTjTbOZ/pub?gid=1820236060&single=true&output=csv";

    // Limpieza de caché de seguridad al cargar
    localStorage.removeItem('backup_m9');

    function parsearCSV(linea) {
        const columnas = [];
        let celda = "", dentroComillas = false;
        for (let char of linea) {
            if (char === '"') dentroComillas = !dentroComillas;
            else if (char === ',' && !dentroComillas) {
                columnas.push(celda.trim());
                celda = "";
            } else celda += char;
        }
        columnas.push(celda.trim());
        return columnas;
    }

    function renderizarMenu(csvText) {
        const lineas = csvText.split(/\r?\n/).filter(l => l.trim() !== "");
        const datos = lineas.slice(1); 
        const contenedor = document.getElementById('precios-layer');
        const mainContent = document.getElementById('main-content');
        const pantallaBloqueo = document.getElementById('bloqueo-tecnico');
        const debug = document.getElementById('debug-status');
        
        // --- VALIDACIÓN DE SEGURIDAD ---
        if (csvText.includes("BLOQUEAR")) {
            pantallaBloqueo.style.display = "flex";
            mainContent.style.display = "none";
            debug.innerHTML = "✔"; 
            debug.className = "online";
            return;
        } else {
            pantallaBloqueo.style.display = "none";
            mainContent.style.display = "block";
        }

        let htmlFinal = "";

        // Mapeo para los 4 cuadrantes (Fila 1 a 4 del Excel)
        const cuadrantes = [
            { ref: "pos-1-ref", bs: "pos-1-bs" }, 
            { ref: "pos-3-ref", bs: "pos-3-bs" }, 
            { ref: "pos-2-ref", bs: "pos-2-bs" }, 
            { ref: "pos-4-ref", bs: "pos-4-bs" }  
        ];

        datos.forEach((linea, i) => {
            if (i < 4) { 
                const col = parsearCSV(linea);
                const precioBs = col[1];  
                const precioRef = col[3]; 
                
                if (precioBs || precioRef) {
                    const pos = cuadrantes[i];
                    htmlFinal += `
                        <div class="dato-dinamico ${pos.ref}">${precioRef}</div>
                        <div class="dato-dinamico ${pos.bs}">${precioBs}</div>
                    `;
                }
            }
        });
        
        contenedor.innerHTML = htmlFinal;
        debug.innerHTML = "✔";
        debug.className = "online";
    }

    async function sincronizar() {
        const t = new Date().getTime();
        const debug = document.getElementById('debug-status');
        try {
            const res = await fetch(`${sheetURL}&cb=${t}`, {
                method: 'GET',
                cache: 'no-store'
            });
            if (!res.ok) throw new Error();
            const csvText = await res.text();
            localStorage.setItem('backup_m9', csvText);
            renderizarMenu(csvText);
        } catch (e) {
            const backup = localStorage.getItem('backup_m9');
            if (backup) renderizarMenu(backup);
            debug.innerHTML = "✘";
            debug.className = "offline";
        }
    }

    sincronizar();
    setInterval(sincronizar, 120000); // Actualiza cada 2 minutos
</script>
</body>
</html>
