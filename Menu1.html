<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INVENIO - Digital Signage Menú 1</title>
    <style>
        @font-face {
            font-family: 'HandelsonFour';
            src: url('./Handelson-Four.otf') format('opentype');
            font-weight: normal; font-style: normal;
        }

        body { 
            margin: 0; padding: 0; background-color: #1a1a1a; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow: hidden;
        }

        .menu-wrapper {
            position: relative;
            width: 100vw; height: 56.25vw; 
            max-width: 1920px; max-height: 1080px;
            background-image: url('Menu1.png') !important;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        @keyframes fadeInPrecios {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dato-dinamico {
            position: absolute;
            font-family: 'HandelsonFour', sans-serif;
            color: #FFFFFF;
            font-size: 2vw;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            white-space: nowrap;
            display: block;
            text-align: right; 
            width: 150px; 
            animation: fadeInPrecios 1s ease-out forwards;
            opacity: 0;
        }

        .col-ref { left: 64%; } 
        .col-bs  { left: 76%; }

        .fila-0 { top: 30.4%; } .fila-1 { top: 38.3%; } .fila-2 { top: 46.2%; }
        .fila-3 { top: 70.5%; } .fila-4 { top: 78.3%; }

        #bloqueo-tecnico {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; color: #fff;
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 9999; text-align: center; font-family: sans-serif;
        }
        #bloqueo-tecnico h1 { font-size: 5vw; margin: 0; }

        #debug-status {
            position: fixed; bottom: 10px; left: 10px;
            font-size: 16px; z-index: 1000;
        }
        .online { color: #00FF00; opacity: 0.3; }
        .offline { color: #FF0000; opacity: 1; }
    </style>
</head>
<body>

    <div id="bloqueo-tecnico">
        <h1>CONTACTAR AL SERVICIO TÉCNICO</h1>
    </div>

    <div class="menu-wrapper" id="menu-container"></div>
    
    <div id="debug-status"></div>

<script>
    // URL de tu Web App de Google Apps Script
    const webAppURL = "https://script.google.com/macros/s/AKfycbwfHVSA-RuBHQ-F0hYzlJsfO-RwZKPvFhxQOYnyXZvt9tWxii06913-UFTb62OvM8Ax/exec";

    localStorage.clear();

    function renderizarMenu(data) {
        const contenedor = document.getElementById('menu-container');
        const pantallaBloqueo = document.getElementById('bloqueo-tecnico');
        const debug = document.getElementById('debug-status');

        // VALIDACIÓN: Si la primera celda dice BLOQUEAR
        if (data[0] && data[0][0] === "BLOQUEAR") {
            pantallaBloqueo.style.display = "flex";
            contenedor.style.display = "none";
            debug.innerHTML = "✔";
            debug.className = "online";
            return;
        } else {
            pantallaBloqueo.style.display = "none";
            contenedor.style.display = "block";
        }

        let htmlFinal = "";

        // Procesamos el JSON recibido (array de filas)
        for (let i = 1; i < data.length; i++) {
            if (i - 1 < 5) { // Control de filas (máximo 5)
                const fila = data[i];
                const precioBs = fila[1]; 
                const precioRef = fila[3];
                
                if (precioBs !== undefined && precioBs !== "") {
                    const delay = (i - 1) * 0.08;
                    htmlFinal += `
                        <div class="dato-dinamico col-bs fila-${i-1}" style="animation-delay: ${delay}s">${precioBs}</div>
                        <div class="dato-dinamico col-ref fila-${i-1}" style="animation-delay: ${delay + 0.04}s">${precioRef}</div>
                    `;
                }
            }
        }

        contenedor.innerHTML = htmlFinal;
        debug.innerHTML = "✔";
        debug.className = "online";
    }

    async function actualizarMenu() {
        const debug = document.getElementById('debug-status');
        try {
            const res = await fetch(webAppURL);
            if (!res.ok) throw new Error();
            const data = await res.json(); 
            localStorage.setItem('backup_m1_fresco', JSON.stringify(data));
            renderizarMenu(data);
        } catch (error) {
            const backup = localStorage.getItem('backup_m1_fresco');
            if (backup) renderizarMenu(JSON.parse(backup));
            debug.innerHTML = "✘";
            debug.className = "offline";
        }
    }

    actualizarMenu();
    setInterval(actualizarMenu, 120000); // 2 minutos

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
</script>
</body>
</html>
