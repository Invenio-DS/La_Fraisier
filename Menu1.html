<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INVENIO - Menú Digital</title>
    <style>
        /* 1. CARGA DE FUENTE .OTF */
        @font-face {
            font-family: 'HandelsonFour';
            src: url('./Handelson-Four.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        body { 
            margin: 0; padding: 0; background-color: #000; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow: hidden;
        }

        /* 2. REFERENCIA A TU IMAGEN menu1.png */
        .menu-wrapper {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* Mantiene 16:9 */
            max-width: 1920px;
            max-height: 1080px;
            background: url('./Menu1.png') no-repeat center center;
            background-size: cover;
        }

        .dato-dinamico {
            position: absolute;
            font-family: 'HandelsonFour', sans-serif;
            color: #FFFFFF;
            font-size: 2.1vw;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            white-space: nowrap;
        }

        /* Coordenadas */
        .col-ref { left: 74.4%; }
        .col-bs  { left: 88.3%; }
        
        .fila-0 { top: 30.1%; }
        .fila-1 { top: 37.1%; }
        .fila-2 { top: 44.1%; }
        .fila-3 { top: 71.0%; }
        .fila-4 { top: 78.0%; }
    </style>
</head>
<body>

    <div class="menu-wrapper" id="menu">
        </div>

    <script>
        // URL con el GID de la pestaña 2 (996245756)
        const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRP_2V2eaoFc7-LdDWqGKGPNjAnTsjzUDnPSixlq8cL3M0acXOwobipdRIyvBGBzyMr0OmPCDTjTbOZ/pub?gid=996245756&single=true&output=csv";

        const formatVE = (val) => {
            return new Intl.NumberFormat('de-DE', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(val);
        };

        async function actualizarMenu() {
            try {
                const res = await fetch(sheetURL);
                const data = await res.text();
                
                // Dividir por líneas y limpiar espacios en blanco
                const filas = data.split(/\r?\n/).filter(linea => linea.trim() !== "").slice(1);
                
                const contenedor = document.getElementById('menu');
                contenedor.innerHTML = "";

                filas.forEach((linea, i) => {
                    // Usar una expresión regular para manejar comas dentro de comillas si las hay
                    const col = linea.split(",");
                    
                    if (col.length >= 4) {
                        // Limpieza: quitamos puntos de miles y cambiamos coma decimal por punto
                        const refRaw = col[1].replace(/\./g, '').replace(',', '.');
                        const tasaRaw = col[3].replace(/\./g, '').replace(',', '.');
                        
                        const ref = parseFloat(refRaw);
                        const tasa = parseFloat(tasaRaw);

                        if (!isNaN(ref) && !isNaN(tasa)) {
                            const calculoBs = ref * tasa;

                            contenedor.innerHTML += `
                                <div class="dato-dinamico col-ref fila-${i}">${col[1]}</div>
                                <div class="dato-dinamico col-bs fila-${i}">${formatVE(calculoBs)}</div>
                            `;
                        }
                    }
                });
                console.log("Sincronización exitosa con Pestaña 2.");
            } catch (e) {
                console.error("Error de conexión:", e);
            }
        }

        actualizarMenu();
        setInterval(actualizarMenu, 600000);
    </script>
</body>
</html>
