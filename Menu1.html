<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INVENIO - Digital Signage</title>
    <style>
        @font-face {
            font-family: 'HandelsonFour';
            src: url('./handelson-Four.otf') format('opentype');
            font-weight: normal; font-style: normal;
        }

        body { 
            margin: 0; padding: 0; background-color: #1a1a1a; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow: hidden;
        }

        /* Forzamos que el contenedor sea visible */
        .menu-wrapper {
            position: relative;
            width: 100vw; height: 56.25vw; 
            max-width: 1920px; max-height: 1080px;
            background-image: url('Menu1.png') !important;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        /* 1. Definir la animación de entrada */
        @keyframes fadeInPrecios {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dato-dinamico {
            position: absolute;
            font-family: 'HandelsonFour', sans-serif;
            color: #FFFFFF;
            font-size: 2.1vw;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            white-space: nowrap;
            
            /* 2. ALINEACIÓN A LA DERECHA */
            display: block;
            text-align: right; 
            width: 150px; /* Ancho fijo para que el 'right' tenga un eje común */
            
            /* 3. APLICAR ANIMACIÓN */
            animation: fadeInPrecios 0.8s ease-out forwards;
        }

        /* Ajustamos el "left" para que el borde derecho coincida con tu diseño */
        /* Columna B (Ref) - Izquierda */
        .col-ref { left: 68%; } 
        
        /* Columna D (Bs) - Derecha */
        .col-bs  { left: 82%; }

        /* Filas (Eje Y) */
        .fila-0 { top: 30.1%; } .fila-1 { top: 37.1%; } .fila-2 { top: 44.1%; }
        .fila-3 { top: 71.0%; } .fila-4 { top: 78.0%; }
    </style>
</head>
<body>

    <div class="menu-wrapper" id="menu-container">
        </div>

  <script>
    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRP_2V2eaoFc7-LdDWqGKGPNjAnTsjzUDnPSixlq8cL3M0acXOwobipdRIyvBGBzyMr0OmPCDTjTbOZ/pub?gid=996245756&single=true&output=csv";

    async function actualizarPrecios() {
        try {
            const res = await fetch(`${sheetURL}&v=${new Date().getTime()}`);
            const csvText = await res.text();
            const lineas = csvText.split(/\r?\n/).filter(l => l.trim() !== "");
            const datos = lineas.slice(1); 
            
            const contenedor = document.getElementById('menu-container');
            let htmlFinal = "";

            datos.forEach((linea, i) => {
                // Función simple para separar comas
                const col = linea.split(",").map(c => c.replace(/"/g, "").trim());
                
                if (col.length >= 4) {
                    const ref = col[1]; // Columna B
                    const bs = col[3];  // Columna D

                    if (ref) {
                        // Inyectamos con retraso escalonado para un efecto visual premium
                        const delay = i * 0.1; 
                        htmlFinal += `
                            <div class="dato-dinamico col-ref fila-${i}" style="animation-delay: ${delay}s">${ref}</div>
                            <div class="dato-dinamico col-bs fila-${i}" style="animation-delay: ${delay + 0.05}s">${bs}</div>
                        `;
                    }
                }
            });

            contenedor.innerHTML = htmlFinal;
        } catch (e) { console.error("Error INVENIO:", e); }
    }

    actualizarPrecios();
    setInterval(actualizarPrecios, 300000);
</script>
</body>
</html>
