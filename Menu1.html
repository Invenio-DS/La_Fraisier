<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INVENIO - Digital Signage</title>
    <style>
        @font-face {
            font-family: 'HandelsonFour';
            src: url('./handelson-Four.otf') format('opentype');
            font-weight: normal; font-style: normal;
        }

        body { 
            margin: 0; padding: 0; background-color: #1a1a1a; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow: hidden;
        }

        /* Forzamos que el contenedor sea visible */
        .menu-wrapper {
            position: relative;
            width: 100vw; height: 56.25vw; 
            max-width: 1920px; max-height: 1080px;
            background-image: url('Menu1.png') !important;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        .dato-dinamico {
            position: absolute;
            font-family: 'HandelsonFour', sans-serif;
            color: #FFFFFF;
            font-size: 2.1vw;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            white-space: nowrap;
            z-index: 2;
        }

        /* Coordenadas */
        .col-ref { left: 74.4%; }
        .col-bs  { left: 88.3%; }
        .fila-0 { top: 30.1%; } .fila-1 { top: 37.1%; } .fila-2 { top: 44.1%; }
        .fila-3 { top: 71.0%; } .fila-4 { top: 78.0%; }
    </style>
</head>
<body>

    <div class="menu-wrapper" id="menu-container">
        </div>

    <script>
        // URL de la Pestaña 2
        const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRP_2V2eaoFc7-LdDWqGKGPNjAnTsjzUDnPSixlq8cL3M0acXOwobipdRIyvBGBzyMr0OmPCDTjTbOZ/pub?gid=996245756&single=true&output=csv";

        const formatVE = (val) => {
            return new Intl.NumberFormat('de-DE', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(val);
        };

        async function cargarMenu() {
            try {
                const res = await fetch(sheetURL);
                if (!res.ok) throw new Error("Error de red");
                
                const csvText = await res.text();
                // Limpieza manual segura de líneas
                const lineas = csvText.split(/\r?\n/).filter(l => l.trim() !== "");
                const datos = lineas.slice(1); // Omitir cabecera
                
                const contenedor = document.getElementById('menu-container');
                let htmlFinal = "";

                datos.forEach((linea, i) => {
                    const col = linea.split(",");
                    if (col.length >= 4) {
                        // Procesamiento numérico ultra-seguro (sin eval ni funciones dinámicas)
                        const ref = parseFloat(col[1].replace(/\./g, '').replace(',', '.'));
                        const tasa = parseFloat(col[3].replace(/\./g, '').replace(',', '.'));
                        
                        if (!isNaN(ref) && !isNaN(tasa)) {
                            const totalBs = ref * tasa;
                            
                            // Construimos el string de HTML para evitar inyecciones múltiples
                            htmlFinal += `<div class="dato-dinamico col-ref fila-${i}">${col[1]}</div>`;
                            htmlFinal += `<div class="dato-dinamico col-bs fila-${i}">${formatVE(totalBs)}</div>`;
                        }
                    }
                });
                
                contenedor.innerHTML = htmlFinal;
                console.log("Menú INVENIO actualizado correctamente.");

            } catch (err) {
                console.error("Error cargando el menú:", err);
            }
        }

        // Ejecutar
        cargarMenu();
        // Sincronizar cada 10 min
        setInterval(cargarMenu, 600000);
    </script>
</body>
</html>
