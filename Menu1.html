<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INVENIO - Digital Signage</title>
    <style>
        @font-face {
            font-family: 'HandelsonFour';
            src: url('./handelson-Four.otf') format('opentype');
            font-weight: normal; font-style: normal;
        }

        body { 
            margin: 0; padding: 0; background-color: #1a1a1a; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow: hidden;
        }

        /* Forzamos que el contenedor sea visible */
        .menu-wrapper {
            position: relative;
            width: 100vw; height: 56.25vw; 
            max-width: 1920px; max-height: 1080px;
            background-image: url('Menu1.png') !important;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        /* 1. Definir la animación de entrada */
        @keyframes fadeInPrecios {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(3); }
        }

        .dato-dinamico {
            position: absolute;
            font-family: 'HandelsonFour', sans-serif;
            color: #FFFFFF;
            font-size: 2vw;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            white-space: nowrap;
            
            /* 2. ALINEACIÓN A LA DERECHA */
            display: block;
            text-align: right; 
            width: 150px; /* Ancho fijo para que el 'right' tenga un eje común */
            
            /* 3. APLICAR ANIMACIÓN */
            animation: fadeInPrecios 1s ease-out forwards;
        }

        /* Ajustamos el "left" para que el borde derecho coincida con tu diseño */
        /* Columna B (Ref) - Izquierda */
        .col-ref { left: 64%; } 
        
        /* Columna D (Bs) - Derecha */
        .col-bs  { left: 76%; }

        /* Filas (Eje Y) */
        .fila-0 { top: 30.2%; } .fila-1 { top: 37.8%; } .fila-2 { top: 45.2%; }
        .fila-3 { top: 70.5%; } .fila-4 { top: 78.1%; }
    </style>
</head>
<body>

    <div class="menu-wrapper" id="menu-container">
        </div>

 <script>
    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRP_2V2eaoFc7-LdDWqGKGPNjAnTsjzUDnPSixlq8cL3M0acXOwobipdRIyvBGBzyMr0OmPCDTjTbOZ/pub?gid=996245756&single=true&output=csv";

    // Función para procesar CSV protegiendo las comas internas de los nombres
    function parsearCSV(linea) {
        const columnas = [];
        let celda = "";
        let dentroComillas = false;
        for (let char of linea) {
            if (char === '"') dentroComillas = !dentroComillas;
            else if (char === ',' && !dentroComillas) {
                columnas.push(celda.trim());
                celda = "";
            } else celda += char;
        }
        columnas.push(celda.trim());
        return columnas;
    }

    async function actualizarMenu() {
        console.log("INVENIO: Sincronizando B (Bs.) y D (Ref)...");
        try {
            const res = await fetch(`${sheetURL}&nocache=${new Date().getTime()}`);
            const csvText = await res.text();
            const lineas = csvText.split(/\r?\n/).filter(l => l.trim() !== "");
            const datos = lineas.slice(1); // Saltar encabezado
            
            const contenedor = document.getElementById('menu-container');
            let htmlFinal = "";

            datos.forEach((linea, i) => {
                const col = parsearCSV(linea);
                
                // NUEVO MAPEO SEGÚN TU SOLICITUD:
                // col[1] = Columna B (Bs.)
                // col[3] = Columna D (Ref)
                
                if (col.length >= 4) {
                    const precioBs = col[1]; 
                    const precioRef = col[3];

                    if (precioBs && precioBs !== "") {
                        const delay = i * 0.08; // Efecto cascada elegante
                        
                        htmlFinal += `
                            <div class="dato-dinamico col-bs fila-${i}" style="animation-delay: ${delay}s">
                                ${precioBs}
                            </div>
                            <div class="dato-dinamico col-ref fila-${i}" style="animation-delay: ${delay + 0.04}s">
                                ${precioRef}
                            </div>
                        `;
                    }
                }
            });

            contenedor.innerHTML = htmlFinal;
            console.log("INVENIO: Renderizado finalizado con éxito.");

        } catch (error) {
            console.error("Error en la carga de datos:", error);
        }
    }

    actualizarMenu();
    setInterval(actualizarMenu, 300000); // 5 minutos
</script>
</body>
</html>
