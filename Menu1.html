<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INVENIO - Digital Signage</title>
    <style>
        @font-face {
            font-family: 'HandelsonFour';
            src: url('./handelson-Four.otf') format('opentype');
            font-weight: normal; font-style: normal;
        }

        body { 
            margin: 0; padding: 0; background-color: #1a1a1a; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow: hidden;
        }

        /* Forzamos que el contenedor sea visible */
        .menu-wrapper {
            position: relative;
            width: 100vw; height: 56.25vw; 
            max-width: 1920px; max-height: 1080px;
            background-image: url('Menu1.png') !important;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        .dato-dinamico {
            position: absolute;
            font-family: 'HandelsonFour', sans-serif;
            color: #FFFFFF;
            font-size: 2.1vw;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            white-space: nowrap;
            z-index: 2;
        }

        /* Coordenadas */
        .col-ref { left: 89%; }
        .col-bs  { left: 70%; }
        .fila-0 { top: 30.2%; } .fila-1 { top: 38.1%; } .fila-2 { top: 45.4%; }
        .fila-3 { top: 70.1%; } .fila-4 { top: 78.1%; }
    </style>
</head>
<body>

    <div class="menu-wrapper" id="menu-container">
        </div>

   <script>
    // URL de tu pestaña "Menu1" (GID: 996245756)
    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRP_2V2eaoFc7-LdDWqGKGPNjAnTsjzUDnPSixlq8cL3M0acXOwobipdRIyvBGBzyMr0OmPCDTjTbOZ/pub?gid=996245756&single=true&output=csv";

    // Función para limpiar y separar CSV correctamente (maneja comas internas)
    function procesarLineaCSV(linea) {
        const resultado = [];
        let celda = "";
        let entreComillas = false;
        for (let char of linea) {
            if (char === '"') entreComillas = !entreComillas;
            else if (char === ',' && !entreComillas) {
                resultado.push(celda.trim());
                celda = "";
            } else celda += char;
        }
        resultado.push(celda.trim());
        return resultado;
    }

    async function actualizarPrecios() {
        console.log("INVENIO: Sincronizando datos directos...");
        try {
            // Buscamos los datos con un "cache bust" para que siempre sean los últimos
            const res = await fetch(`${sheetURL}&version=${new Date().getTime()}`);
            const csvText = await res.text();
            
            // Dividir por líneas y quitar la cabecera
            const lineas = csvText.split(/\r?\n/).filter(l => l.trim() !== "");
            const datos = lineas.slice(1); 
            
            const contenedor = document.getElementById('menu-container');
            let htmlFinal = "";

            datos.forEach((linea, i) => {
                const col = procesarLineaCSV(linea);
                
                // Verificamos que existan las columnas necesarias
                // col[1] es la columna B (Ref)
                // col[3] es la columna D (Bs)
                if (col.length >= 4) {
                    const precioRef = col[1];
                    const precioBs = col[3];

                    // Solo inyectamos si hay datos en Ref
                    if (precioRef !== "" && precioRef !== undefined) {
                        htmlFinal += `<div class="dato-dinamico col-ref fila-${i}">${precioRef}</div>`;
                        htmlFinal += `<div class="dato-dinamico col-bs fila-${i}">${precioBs}</div>`;
                    }
                }
            });

            if (htmlFinal !== "") {
                contenedor.innerHTML = htmlFinal;
                console.log("INVENIO: Precios actualizados desde columnas B y D.");
            } else {
                console.warn("INVENIO: No se encontraron datos en las columnas especificadas.");
            }

        } catch (error) {
            console.error("Error crítico de conexión:", error);
        }
    }

    // Ejecución inicial y refresco cada 5 minutos
    actualizarPrecios();
    setInterval(actualizarPrecios, 300000);
</script>
</body>
</html>
