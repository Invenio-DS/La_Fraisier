<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INVENIO - Digital Signage</title>
    <style>
        @font-face {
            font-family: 'HandelsonFour';
            src: url('./handelson-Four.otf') format('opentype');
            font-weight: normal; font-style: normal;
        }

        body { 
            margin: 0; padding: 0; background-color: #1a1a1a; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow: hidden;
        }

        /* Forzamos que el contenedor sea visible */
        .menu-wrapper {
            position: relative;
            width: 100vw; height: 56.25vw; 
            max-width: 1920px; max-height: 1080px;
            background-image: url('Menu1.png') !important;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        .dato-dinamico {
            position: absolute;
            font-family: 'HandelsonFour', sans-serif;
            color: #FFFFFF;
            font-size: 2.1vw;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            white-space: nowrap;
            z-index: 2;
        }

        /* Coordenadas */
        .col-ref { left: 74.4%; }
        .col-bs  { left: 88.3%; }
        .fila-0 { top: 30.1%; } .fila-1 { top: 37.1%; } .fila-2 { top: 44.1%; }
        .fila-3 { top: 71.0%; } .fila-4 { top: 78.0%; }
    </style>
</head>
<body>

    <div class="menu-wrapper" id="menu-container">
        </div>

    <script>
    // URL de la Pestaña 2 (Verificada)
    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRP_2V2eaoFc7-LdDWqGKGPNjAnTsjzUDnPSixlq8cL3M0acXOwobipdRIyvBGBzyMr0OmPCDTjTbOZ/pub?gid=996245756&single=true&output=csv";

    // Formateador profesional: 1.234,56
    const formatVE = (val) => {
        return new Intl.NumberFormat('de-DE', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }).format(val);
    };

    async function cargarMenu() {
        console.log("INVENIO: Iniciando sincronización...");
        try {
            // Añadimos un timestamp para evitar que el navegador use datos viejos (caché)
            const response = await fetch(`${sheetURL}&time=${new Date().getTime()}`);
            if (!response.ok) throw new Error("No se pudo conectar con Google Sheets");

            const csvText = await response.text();
            console.log("Datos recibidos correctamente.");

            const lineas = csvText.split(/\r?\n/).filter(l => l.trim() !== "");
            const datos = lineas.slice(1); // Omitimos la fila de encabezado
            
            const contenedor = document.getElementById('menu-container');
            let htmlFinal = "";

            datos.forEach((linea, i) => {
                // Dividimos por coma, pero limpiamos espacios extras
                const col = linea.split(",").map(c => c.trim());
                
                if (col.length >= 4) {
                    // Procesamos REF (Columna B / Índice 1)
                    // Quitamos puntos de miles y cambiamos coma por punto para calcular
                    const refLimpio = col[1].replace(/\./g, '').replace(',', '.');
                    const ref = parseFloat(refRaw = refLimpio);

                    // Procesamos TASA (Columna D / Índice 3)
                    const tasaLimpia = col[3].replace(/\./g, '').replace(',', '.');
                    const tasa = parseFloat(tasaRaw = tasaLimpia);

                    if (!isNaN(ref) && !isNaN(tasa)) {
                        const totalBs = ref * tasa;
                        
                        // Generamos el HTML con las coordenadas que ya definimos
                        htmlFinal += `<div class="dato-dinamico col-ref fila-${i}">${col[1]}</div>`;
                        htmlFinal += `<div class="dato-dinamico col-bs fila-${i}">${formatVE(totalBs)}</div>`;
                    } else {
                        console.warn(`Línea ${i+1}: Datos numéricos inválidos`, {ref, tasa});
                    }
                }
            });

            if (htmlFinal === "") {
                console.error("No se generó ningún precio. Revisa las columnas en Sheets.");
            } else {
                contenedor.innerHTML = htmlFinal;
                console.log("¡Precios renderizados con éxito!");
            }

        } catch (err) {
            console.error("Error crítico en INVENIO:", err);
        }
    }

    // Ejecución inmediata
    cargarMenu();
    // Refresco cada 5 minutos
    setInterval(cargarMenu, 300000);
</script>
</body>
</html>
