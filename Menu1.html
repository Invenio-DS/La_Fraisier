<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INVENIO - Digital Signage</title>
    <style>
        @font-face {
            font-family: 'HandelsonFour';
            src: url('./handelson-Four.otf') format('opentype');
            font-weight: normal; font-style: normal;
        }

        body { 
            margin: 0; padding: 0; background-color: #1a1a1a; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow: hidden;
        }

        /* Forzamos que el contenedor sea visible */
        .menu-wrapper {
            position: relative;
            width: 100vw; height: 56.25vw; 
            max-width: 1920px; max-height: 1080px;
            background-image: url('Menu1.png') !important;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        .dato-dinamico {
            position: absolute;
            font-family: 'HandelsonFour', sans-serif;
            color: #FFFFFF;
            font-size: 2.1vw;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            white-space: nowrap;
            z-index: 2;
        }

        /* Coordenadas */
        .col-ref { left: 74.4%; }
        .col-bs  { left: 88.3%; }
        .fila-0 { top: 30.1%; } .fila-1 { top: 37.1%; } .fila-2 { top: 44.1%; }
        .fila-3 { top: 71.0%; } .fila-4 { top: 78.0%; }
    </style>
</head>
<body>

    <div class="menu-wrapper" id="menu-container">
        </div>

   <script>
    // URL verificada con el GID de tu pestaña Menu1
    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRP_2V2eaoFc7-LdDWqGKGPNjAnTsjzUDnPSixlq8cL3M0acXOwobipdRIyvBGBzyMr0OmPCDTjTbOZ/pub?gid=996245756&single=true&output=csv";

    const formatVE = (val) => {
        return new Intl.NumberFormat('de-DE', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }).format(val);
    };

    async function cargarMenu() {
        console.log("INVENIO: Iniciando carga desde pestaña Menu1...");
        try {
            const response = await fetch(`${sheetURL}&cache_bust=${new Date().getTime()}`);
            if (!response.ok) throw new Error("Error al conectar con Google Sheets");

            const csvText = await response.text();
            const lineas = csvText.split(/\r?\n/).filter(l => l.trim() !== "");
            
            // Log para que veas en la consola qué está llegando realmente
            console.log("Columnas detectadas en la primera línea:", lineas[0]);

            const datos = lineas.slice(1); 
            const contenedor = document.getElementById('menu-container');
            let htmlFinal = "";

            datos.forEach((linea, i) => {
                const col = linea.split(",").map(c => c.trim());
                
                // IMPORTANTE: Verifica que REF esté en la columna 2 (índice 1) 
                // y TASA esté en la columna 4 (índice 3)
                if (col.length >= 2) {
                    const refRaw = col[1].replace(/\./g, '').replace(',', '.');
                    const tasaRaw = col[3] ? col[3].replace(/\./g, '').replace(',', '.') : "0";
                    
                    const ref = parseFloat(refRaw);
                    const tasa = parseFloat(tasaRaw);

                    if (!isNaN(ref) && !isNaN(tasa) && tasa > 0) {
                        const totalBs = ref * tasa;
                        
                        htmlFinal += `<div class="dato-dinamico col-ref fila-${i}">${col[1]}</div>`;
                        htmlFinal += `<div class="dato-dinamico col-bs fila-${i}">${formatVE(totalBs)}</div>`;
                    }
                }
            });

            if (htmlFinal === "") {
                console.warn("INVENIO: No se generaron etiquetas. Revisa si la Tasa BCV está en la columna D.");
                contenedor.innerHTML = '<div style="color:white; font-family:sans-serif; font-size:10px; position:absolute; bottom:0;">Error de datos: Revisa la consola (F12)</div>';
            } else {
                contenedor.innerHTML = htmlFinal;
                console.log("INVENIO: ¡Precios renderizados exitosamente!");
            }

        } catch (err) {
            console.error("INVENIO: Fallo crítico:", err);
        }
    }

    cargarMenu();
    setInterval(cargarMenu, 300000); // Refrescar cada 5 minutos
</script>
</body>
</html>
